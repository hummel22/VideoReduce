services:
  videoreduce-backend:
    build: .
    environment:
      VIDEOR_ADMIN_USERNAME: ${VIDEOR_ADMIN_USERNAME:-admin}
      VIDEOR_ADMIN_PASSWORD: ${VIDEOR_ADMIN_PASSWORD:-changeme}
      VIDEOR_JWT_SECRET_KEY: ${VIDEOR_JWT_SECRET_KEY:-change-me}
      VIDEOR_INPUT_DIR: /app/input
      VIDEOR_OUTPUT_DIR: /app/output
      VIDEOR_DATABASE_URL: sqlite:////app/data/videoreduce.db
    volumes:
      - ./data/input:/app/input
      - ./data/output:/app/output
      - ./config/service.yml:/app/config/service.yml:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
